# OPTIONAL: native Git >= 2.56 in every tool that opens this working copy.
# Include LOCALLY in one repository after testing on a copy, not globally.
# No promises of speed: compare your typical fetch/push and maintenance workload.
# This profile does not register/schedule maintenance: see README_RU.md.

[pack]
    # Path-based packing can help repeated Module.bsl / Form.xml paths.
    usePathWalk = true

[fetch]
    # Can reduce negotiation round trips; may transfer more objects.
    negotiationAlgorithm = skipping

[index]
    # Faster index writes by omitting its trailing checksum.
    # Keeps object hashes unchanged. Requires compatible native/embedded clients.
    skipHash = true

[maintenance]
    # Modern large-repository strategy. It can expire unreachable data
    # according to the existing expiration settings; it is not a backup.
    strategy = geometric

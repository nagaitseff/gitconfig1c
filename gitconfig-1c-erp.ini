# Git для больших репозиториев исходников 1С ERP
# Версия 1.0 / 24.10.2026. Требуется native Git >= 2.40.
# UTF-8, без BOM файла. Имя, почта и окончания строк берутся из ваших настроек.
# Подключайте через include из ~/.gitconfig, сохранив свои существующие настройки.
# До подключения: git update-index --test-untracked-cache на каждом типе ФС.
# Настройки ОС, SSD и Git 2.56 описаны отдельно в README_RU.md.

[user]
    # Автор должен быть настроен явно; существующие name/email продолжают работать.
    useConfigOnly = true

[core]
    # Читаемые кириллические пути в выводе команд.
    quotePath = false
    # Принимать CRLF при проверке пробелов; реальные хвостовые пробелы остаются ошибкой.
    whitespace = blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol

[feature]
    # Индекс v4 и untracked cache. Значение skipHash переопределено ниже.
    manyFiles = true

[index]
    # Сохранить контрольную сумму индекса для смешанного набора инструментов.
    # Пропуск суммы индекса доступен отдельно в modern-профиле; хеши объектов не меняются.
    skipHash = false

[init]
    # Только для репозиториев, которые будут созданы позднее.
    defaultBranch = main

[fetch]
    # Убирать устаревшие remote-tracking ветки без включения pruneTags.
    prune = true
    pruneTags = false
    writeCommitGraph = true

[pull]
    # При расхождении истории требуется явный выбор merge/rebase.
    ff = only

[push]
    default = simple
    # Для центрального remote с одноимёнными ветками; подробнее в README.
    autoSetupRemote = true

[diff]
    algorithm = histogram
    renames = true

[diff "bsl"]
    # POSIX ERE, разные регистры, необязательный UTF-8 BOM и Async / Асинх.
    # Нужна строка *.bsl diff=bsl в .gitattributes или .git/info/attributes.
    xfuncname = "^((﻿)?[[:space:]]*(((А|а)(С|с)(И|и)(Н|н)(Х|х)|[Aa][Ss][Yy][Nn][Cc])[[:space:]]+)?((П|п)(Р|р)(О|о)(Ц|ц)(Е|е)(Д|д)(У|у)(Р|р)(А|а)|(Ф|ф)(У|у)(Н|н)(К|к)(Ц|ц)(И|и)(Я|я)|[Pp][Rr][Oo][Cc][Ee][Dd][Uu][Rr][Ee]|[Ff][Uu][Nn][Cc][Tt][Ii][Oo][Nn])[[:space:]]+.*)$"

[merge]
    conflictStyle = zdiff3

[rerere]
    # Повторять прежние текстовые разрешения; проверять результат перед git add.
    enabled = true
    autoupdate = false

[rebase]
    autoSquash = true
    autoStash = false
    # Явный drop работает; случайное удаление строки todo останавливает rebase.
    missingCommitsCheck = error

[branch]
    sort = -committerdate

[tag]
    sort = -version:refname

[log]
    date = iso

[status]
    showUntrackedFiles = normal

[color]
    ui = auto

[alias]
    # Статус. sfast намеренно скрывает НОВЫЕ файлы, переименования и счётчики.
    s = status --short --branch
    sfast = status --short --branch --untracked-files=no --no-renames --no-ahead-behind
    su = status --short --branch --untracked-files=all

    # Diff. dcode/dxml принимают параметры и ревизии; фильтры путей уже встроены.
    d = diff
    ds = diff --staged
    dn = diff --name-status
    dstat = diff --stat
    dquick = diff --no-renames --stat
    dmove = diff --color-moved=dimmed-zebra --color-moved-ws=allow-indentation-change
    dcode = "!f() { git diff \"$@\" -- '*.bsl' '*.os'; }; f"
    dcode-staged = "!f() { git diff --staged \"$@\" -- '*.bsl' '*.os'; }; f"
    dxml = "!f() { git diff \"$@\" -- '*.xml' '*.mdo'; }; f"
    check = diff --check
    check-staged = diff --staged --check
    conflicts = diff --name-only --diff-filter=U
    eol = ls-files --eol

    # История и поиск. Для lg все ветки запрашиваются явно через --all.
    lg = log --graph --decorate --oneline -40
    last = show --stat --oneline HEAD
    filehist = log --follow --stat --
    find = grep -n -I
    search-added = log --all --oneline -S
    search-changed = log --all --oneline -G
    recent = reflog --date=local -30

    # Ветки.
    br = branch --sort=-committerdate
    sw = switch
    new = switch -c
    back = switch -
    fa = fetch --all --prune
    up = pull --ff-only

    # Индекс и коммиты. cv выводит diff по запросу: обновление ERP может быть огромным.
    ap = add --patch
    unstage = restore --staged --
    cv = commit --verbose
    fixup = commit --fixup
    ri = rebase --interactive
    rc = rebase --continue
    ra = rebase --abort
    mc = merge --continue
    ma = merge --abort

    # Stash: shelf сохраняет отслеживаемые файлы, shelf-all также новые файлы.
    shelf = stash push
    shelf-all = stash push --include-untracked
    shelves = stash list
    shelf-show = stash show --patch

    # Worktree: общая база объектов, отдельные рабочие каталоги.
    wt = worktree list
    wta = worktree add
    wtnew = worktree add -b

    # Rerere и диагностика.
    rr = rerere status
    rrdiff = rerere diff
    rrforget = rerere forget --
    size = count-objects -vH
    cfg = config --show-origin --show-scope --list
    aliases = config --get-regexp '^alias\\.'
